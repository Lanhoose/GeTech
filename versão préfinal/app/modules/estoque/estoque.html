<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.U. - Sistema de Inventário Unificado</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <style>
        :root,
        [data-theme="light"] {
            --mod-header-bg:  #2c3e50;
            --mod-accent:     #3498db;
            --mod-btn-bg:     #3498db;
            --mod-btn-hover:  #2980b9;
        }

        [data-theme="dark"] {
            --mod-header-bg:  #1e293b;
            --mod-accent:     #3b82f6;
            --mod-btn-bg:     #3b82f6;
            --mod-btn-hover:  #2563eb;
        }

        body { padding: 0; }

        .header-modulo {
            background-color: var(--mod-header-bg);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--mod-accent);
            transition: background 0.3s;
        }

        .header-modulo h2 { margin: 0; color: #fff; }
        .header-modulo small { opacity: 0.7; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-voltar {
            background: var(--mod-btn-bg);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-voltar:hover { background: var(--mod-btn-hover); transform: scale(1.04); }

        /* Toggle */
        .theme-toggle-wrap { display: flex; align-items: center; gap: 6px; }
        .theme-icon { font-size: 1rem; color: rgba(255,255,255,0.8); }
        .theme-toggle {
            position: relative; width: 44px; height: 24px;
            background: #334155; border-radius: 12px; border: none;
            cursor: pointer; transition: background 0.3s; flex-shrink: 0;
        }
        .theme-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; background: #fff;
            border-radius: 50%; transition: transform 0.3s;
        }
        [data-theme="light"] .theme-toggle { background: var(--mod-accent); }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }

        nav {
            margin: 0;
            border-radius: 0;
            padding: 12px 20px;
        }

        .main-content { padding: 20px; }

        footer { margin-top: auto; }
    </style>
</head>
<body>

    <header class="header-modulo">
        <div>
            <small>Módulo de Operações</small>
            <h2>📦 Gestão de Inventário</h2>
        </div>
        <div class="header-actions">
            <div class="theme-toggle-wrap">
                <span class="theme-icon" id="themeIcon">🌙</span>
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
            </div>
            <button class="btn-voltar" onclick="window.location.href='../../app.html'">← Voltar ao Menu</button>
        </div>
    </header>

    <nav>
        <button onclick="trocarTela('cadastro')">📥 Recebimento</button>
        <button onclick="trocarTela('estoque')">📊 Controle de Estoque</button>
    </nav>

    <div class="main-content">
        <div id="tela-cadastro" class="container">
            <h1>Entrada de Materiais</h1>
            <div class="card">
                <input type="text" id="nomeItem" placeholder="Nome do Produto">
                <input type="number" id="qtdItem" placeholder="Quantidade Inicial">
                <button id="btnRegistrar">Registrar no Sistema</button>
            </div>
            <div class="card" style="margin-top: 20px;">
                <h3>Itens no Pátio (Aguardando Liberação)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </div>

        <div id="tela-estoque" class="container" style="display: none;">
            <h1>Controle de Saída</h1>
            <div class="card">
                <h2 id="produtoSelecionado">Nenhum item selecionado</h2>
                <div id="visorQtd" class="visor">0</div>
                <input type="number" id="valorMovimentacao" placeholder="Quantidade">
                <div style="display: flex; gap: 10px;">
                    <button id="btnEntrada" style="background: #27ae60;">+ Entrada</button>
                    <button id="btnSaida"   style="background: #c0392b;">- Saída</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 S.I.U. - Sistema de Inventário Unificado</p>
    </footer>

    <script>
        // Aplica tema antes do paint
        (function () {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <script src="../../assets/js/estoque.js" defer></script>
    <script>
        // Toggle de tema — inicializa após o DOM
        document.addEventListener('DOMContentLoaded', () => {
            const btn  = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const aplicar = (tema) => {
                document.documentElement.setAttribute('data-theme', tema);
                localStorage.setItem('theme', tema);
                if (icon) icon.textContent = tema === 'dark' ? '🌙' : '☀️';
            };
            aplicar(localStorage.getItem('theme') || 'dark');
            if (btn) btn.addEventListener('click', () => {
                aplicar(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });
        });
    </script>
</body>
</html>
