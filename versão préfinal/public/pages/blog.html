<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEtech - Comunidade Tech</title>
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/blog.css">
</head>
<body>
    <div id="header"></div>

    <main class="container">
        <section class="form-section">
            <h2>✨ Criar Nova Publicação</h2>
            <p class="text-muted">Compartilhe seu conhecimento com a comunidade.</p>
            
            <form id="maintenanceForm">
                <input type="text" id="machineName" placeholder="Título da sua postagem..." required>
                
                <select id="type">
                    <option value="Dúvida">❓ Dúvida</option>
                    <option value="Tutorial">📚 Tutorial</option>
                    <option value="Artigo">📝 Artigo</option>
                    <option value="Notícia">🚀 Notícia</option>
                </select>
                
                <input type="date" id="date" required>
                
                <textarea id="description" rows="5" placeholder="Escreva aqui o conteúdo do seu post..."></textarea>
                
                <button type="submit" class="btn-submit">Publicar no Feed</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Feed da Comunidade</h2>
            <div class="table-responsive">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Assunto</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Prévia do Conteúdo</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/blog.js"></script>
    <script src="../assets/js/component.js"></script>
    <script src="../assets/js/verificacaologin.js"></script>
</body>
</html>
