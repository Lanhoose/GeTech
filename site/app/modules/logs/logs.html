<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria & Logs - ERP Industrial</title>
    <link rel="stylesheet" href="../../assets/css/logs.css">
</head>
<body>
    <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); })();</script>
    <!-- ── HEADER PRÓPRIO DA PÁGINA DE LOGS ── -->
    <header class="logs-header">
        <button class="btn-voltar-erp" onclick="window.location.href='../../app.html'">← Voltar ao ERP</button>

        <div class="logs-header-title">
            <span class="logs-header-icon">🔍</span>
            <span>Auditoria & Logs</span>
        </div>

        <div class="logs-header-right">
            <span class="theme-icon" id="themeIcon">🌙</span>
            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
        </div>
    </header>

    <main class="container">
        <section class="log-header-section hidden-track">
            <h1 class="section-title">Histórico Digital de Auditoria</h1>
            <p class="subtitle-page">Rastreabilidade imutável de ações executadas no ecossistema ERP em conformidade com as normas de segurança corporativa.</p>
            
            <div class="action-bar">
                <button class="btn-secondary" onclick="exportarLogs()">📥 Gerar Relatório CSV</button>
                <button class="btn-danger-outline" onclick="limparHistorico()">🗑️ Resetar Logs</button>
            </div>
        </section>

        <!-- ── BARRA DE FILTROS ── -->
        <section class="filter-bar hidden-track">
            <div class="filter-group">
                <label for="filtroTexto">🔎 Busca geral</label>
                <input type="text" id="filtroTexto" placeholder="ID, operador, ação, descrição..." />
            </div>
            <div class="filter-group">
                <label for="filtroCriticidade">Status</label>
                <select id="filtroCriticidade">
                    <option value="">Todos</option>
                    <option value="info">INFO</option>
                    <option value="aviso">AVISO</option>
                    <option value="critico">CRÍTICO</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filtroDataInicio">De</label>
                <input type="date" id="filtroDataInicio" />
            </div>
            <div class="filter-group">
                <label for="filtroDataFim">Até</label>
                <input type="date" id="filtroDataFim" />
            </div>
            <label class="filter-group">Usuário<input type="search" id="filtroUsuario" placeholder="Nome, e-mail ou ID"></label>
            <label class="filter-group">Ação<input type="search" id="filtroAcao" placeholder="Ex. ordem concluída"></label>
            <span id="statusFiltros" role="status"></span>
            <button class="btn-filter-clear" onclick="limparFiltros()" title="Limpar filtros">✕ Limpar</button>
        </section>

        <section class="log-table-container hidden-track">
            <div class="table-info-bar">
                <span id="contadorResultados" class="contador-logs">— registros</span>
            </div>
            <div class="table-responsive">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>ID do Log</th>
                            <th>Data & Hora</th>
                            <th>Operador</th>
                            <th>Ação / Evento</th>
                            <th>Descrição Complementar</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-secondary);">Nenhum log registrado até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="../../assets/js/protecao-gestor.js"></script>
    <script type="module" src="../../assets/js/logs.js"></script>
    <script src="../../assets/js/acessibilidade.js"></script>
    
    <script>
        // ── TEMA ────────────────────────────────────────────────────────────
        (function() {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const btn  = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');

            const aplicarTema = (t) => {
                document.documentElement.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
                if (icon) icon.textContent = t === 'dark' ? '🌙' : '☀️';
            };

            aplicarTema(localStorage.getItem('theme') || 'dark');
            if (btn) btn.addEventListener('click', () =>
                aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
            );
        });

        // ── FILTROS ─────────────────────────────────────────────────────────
        let _logsCache = [];

        const camposFiltro = ['filtroTexto', 'filtroUsuario', 'filtroAcao', 'filtroCriticidade', 'filtroDataInicio', 'filtroDataFim'];
        const normalizar = valor => String(valor ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim();
        const diaLocal = new Intl.DateTimeFormat('sv-SE', { year: 'numeric', month: '2-digit', day: '2-digit' });

        function logsFiltrados() {
            const [busca, usuario, acao, criticidade, inicio, fim] = camposFiltro.map(id => document.getElementById(id).value);
            const intervaloInvalido = Boolean(inicio && fim && inicio > fim);
            document.getElementById('statusFiltros').textContent = intervaloInvalido ? 'A data inicial deve ser anterior ou igual à final.' : '';
            if (intervaloInvalido) return [];
            return _logsCache.filter(log => {
                const data = new Date(log.dataHora);
                const dia = Number.isFinite(data.getTime()) ? diaLocal.format(data) : '';
                return normalizar([log.id, log.usuario, log.usuarioEmail, log.acao, log.detalhe].join(' ')).includes(normalizar(busca))
                    && normalizar([log.usuario, log.usuarioEmail, log.usuarioUid].join(' ')).includes(normalizar(usuario))
                    && normalizar(log.acao).includes(normalizar(acao))
                    && (!criticidade || log.criticidade === criticidade)
                    && (!(inicio || fim) || (dia && (!inicio || dia >= inicio) && (!fim || dia <= fim)));
            });
        }

        function aplicarFiltros() {
            renderizarLogs(logsFiltrados());
        }

        function limparFiltros() {
            camposFiltro.forEach(id => { document.getElementById(id).value = ''; });
            aplicarFiltros();
        }

        // ── RENDERIZAÇÃO ────────────────────────────────────────────────────
        function renderizarLogs(logs) {
    const tbody    = document.getElementById('log-table-body');
    const contador = document.getElementById('contadorResultados');

    tbody.innerHTML = '';

    if (contador) {
        contador.textContent = `${logs.length} registro${logs.length !== 1 ? 's' : ''} encontrado${logs.length !== 1 ? 's' : ''}`;
    }

    if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-secondary);">
            Nenhum registro corresponde aos filtros aplicados.
        </td></tr>`;
        return;
    }

    logs.forEach(log => {
        const data = new Date(log.dataHora);
        const row = document.createElement('tr');
        const valores = [log.id, Number.isFinite(data.getTime()) ? data.toLocaleString('pt-BR') : '—',
            log.usuario, log.acao, log.detalhe];
        const classes = ['log-id', 'log-date', 'log-user', 'log-action', 'log-detail'];
        valores.forEach((valor, indice) => {
            const celula = row.insertCell();
            celula.className = classes[indice];
            celula.textContent = valor;
        });
        if (log.usuarioEmail && log.usuarioEmail !== log.usuario) {
            const email = document.createElement('small');
            email.className = 'log-email';
            email.textContent = log.usuarioEmail;
            row.cells[2].append(document.createElement('br'), email);
        }
        const os = log.ordemServicoId || (/^OS ([\w-]+)\s/.exec(log.detalhe) || [])[1];
        if (/^[\w-]+$/.test(os || '') && normalizar(log.acao) === 'manutencao: ordem concluida') {
            const link = document.createElement('a');
            link.href = '../manutencao/manutencao.html?' + new URLSearchParams({ os });
            link.textContent = 'Abrir ordem';
            row.cells[4].append(document.createElement('br'), link);
        }
        const criticidade = ['info', 'aviso', 'critico'].includes(log.criticidade) ? log.criticidade : 'info';
        const badge = document.createElement('span');
        badge.className = 'badge-status-log badge-' + criticidade;
        badge.textContent = String(log.criticidade || 'info').toUpperCase();
        row.insertCell().append(badge);
        tbody.appendChild(row);
    });
}
        async function carregarTabelaLogs() {
            if (!window.Auditoria) {
                console.warn('[Logs] Auditoria ainda não foi carregado.');
                return;
            }

            try {
                _logsCache = await window.Auditoria.obterLogs();
                aplicarFiltros();
            } catch (erro) {
                console.error('[Logs] Erro ao carregar tabela:', erro);
                _logsCache = [];
                aplicarFiltros();
            }
        }

        // ── AÇÕES DA BARRA ───────────────────────────────────────────────────
        async function limparHistorico() {
            if (!confirm("Tem certeza que deseja apagar permanentemente todos os registros de auditoria?")) return;
            if (!window.Auditoria) return alert('O módulo de auditoria ainda está carregando. Tente novamente.');

            const sucesso = await window.Auditoria.limparLogs();
            if (sucesso) {
                await carregarTabelaLogs();
            } else {
                alert('Não foi possível limpar os logs. Verifique suas permissões no Firebase.');
            }
        }

        window.aplicarFiltros = aplicarFiltros;
        window.limparFiltros = limparFiltros;
        window.limparHistorico = limparHistorico;
        window.exportarLogs = exportarLogs;

        window.addEventListener('getech:logs-updated', (evento) => {
            _logsCache = Array.isArray(evento.detail) ? evento.detail : [];
            aplicarFiltros();
        });

        function exportarLogs() {
            const logsVisiveis = logsFiltrados();

            if (logsVisiveis.length === 0) return alert("Não há registros para exportar.");

            const campoCsv = valor => {
                const texto = String(valor ?? '');
                const seguro = /^[\s]*[=+@-]/.test(texto) ? "'" + texto : texto;
                return '"' + seguro.replaceAll('"', '""') + '"';
            };
            const linhas = logsVisiveis.map(l => [l.id, l.dataHora, l.usuario, l.usuarioEmail, l.acao, l.detalhe, l.criticidade]
                .map(campoCsv).join(';'));
            const csv = ['ID;Data/Hora;Usuario;Email;Acao;Detalhe;Criticidade', ...linhas].join('\r\n');

            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `auditoria_erp_${new Date().toLocaleDateString('pt-BR')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ── INICIALIZAÇÃO CORRIGIDA ──────────────────────────────────────────
        document.addEventListener("DOMContentLoaded", async () => {
            // O logs.js é um módulo e pode terminar de inicializar depois do DOM.
            await carregarTabelaLogs();

            // Atribui os escutadores dos filtros em tempo real
            camposFiltro.forEach(id => document.getElementById(id).addEventListener('input', aplicarFiltros));

            // Executa a remoção do track invisível de forma uniforme e cadenciada para os 3 blocos
            setTimeout(() => {
                const els = document.querySelectorAll('.hidden-track');
                els.forEach(el => el.classList.remove('hidden-track'));
            }, 200); 
        });
    </script>
</body>
</html>
