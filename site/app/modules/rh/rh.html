<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/rh.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>S.G.R.H. - GeTech</title>
</head>
<body>

    <script>
        (function () {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>

    <header class="header-modulo">
        <div>
            <small>Módulo de Operações</small>
            <h2><i class="fa-solid fa-id-card-clip"></i> Gestão de Recursos Humanos</h2>
        </div>
        <div class="header-actions">
            <div class="theme-toggle-wrap">
                <span class="theme-icon" id="themeIcon">🌙</span>
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
            </div>
            <button class="btn-voltar" onclick="window.location.href='../../app.html'">← Voltar ao Menu</button>
        </div>
    </header>

    <main class="rh-container">
        
        <div class="sub-nav-container">
            <button id="btn-nav-cadastro" class="nav-tab-btn active" onclick="trocarTela('cadastro')">
                <i class="fas fa-user-plus"></i> Registrar Usuário
            </button>
            <button id="btn-nav-ponto" class="nav-tab-btn" onclick="trocarTela('ponto')">
                <i class="fas fa-clock"></i> Registrar Ponto
            </button>
        </div>
        
        <div id="tela-cadastro">
            <section class="panel-section">
                <div class="panel-header">
                    <h2><i class="fas fa-user-plus" style="color: var(--accent);"></i> Cadastro de Funcionário</h2>
                </div>
                
                <div class="form-grid">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nomeFuncionario">Nome Completo</label>
                            <input type="text" id="nomeFuncionario" placeholder="Ex: Lucas Silva">
                        </div>
                        <div class="form-group">
                            <label for="emailFuncionario">E-mail Corporativo</label>
                            <input type="email" id="emailFuncionario" placeholder="Ex: lucas@getech.com">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 0 0 30%;">
                            <label for="cep">CEP (Digite e saia do campo)</label>
                            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                        </div>
                        <div class="form-group" style="flex: 0 0 70%;">
                            <label for="rua">Rua / Logradouro</label>
                            <input type="text" id="rua" placeholder="Logradouro automático..." readonly>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" placeholder="Bairro automático..." readonly>
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Cidade automática..." readonly>
                        </div>
                        <div class="form-group" style="flex: 0 0 15%;">
                            <label for="uf">UF</label>
                            <input type="text" id="uf" placeholder="--" readonly>
                        </div>
                    </div>
                </div>
                
                <button id="btnCadastrar">Admitir Colaborador</button>
            </section>

            <section class="panel-section">
                <div class="panel-header">
                    <h2><i class="fas fa-users" style="color: var(--accent);"></i> Funcionários Ativos</h2>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Endereço Cadastrado</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaRH"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="tela-ponto" style="display: none;">
            <section class="panel-section">
                <div class="panel-header">
                    <h2><i class="fas fa-clock" style="color: var(--accent);"></i> Relógio de Ponto Eletrônico</h2>
                </div>
                
                <h3 id="colaboradorSelecionado" style="margin-top: 0;">Nenhum funcionário selecionado</h3>
                
                <div class="ponto-display-box">
                    <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;">Último Registro / Status</p>
                    <div id="visorStatus" class="visor-ponto">Aguardando batida...</div>
                </div>

                <div class="btn-flex">
                    <button id="btnEntrada" class="btn-entrada"><i class="fas fa-sign-in-alt"></i> Registrar Entrada</button>
                    <button id="btnSaida" class="btn-saida"><i class="fas fa-sign-out-alt"></i> Registrar Saída</button>
                </div>
            </section>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 GeTech - Sistema de Gestão Integrado</p>
    </footer>

    <script type="module" src="../../assets/js/rh.js"></script>
    <script src="../../assets/js/acessibilidade.js"></script>
    <script>
        window.trocarTela = function(tela) {
            const telaCadastro = document.getElementById("tela-cadastro");
            const telaPonto = document.getElementById("tela-ponto");
            const btnNavCadastro = document.getElementById("btn-nav-cadastro");
            const btnNavPonto = document.getElementById("btn-nav-ponto");

            if (tela === 'cadastro') {
                if (telaCadastro) telaCadastro.style.display = "block";
                if (telaPonto) telaPonto.style.display = "none";
                if (btnNavCadastro) btnNavCadastro.classList.add("active");
                if (btnNavPonto) btnNavPonto.classList.remove("active");
            } else if (tela === 'ponto') {
                if (telaCadastro) telaCadastro.style.display = "none";
                if (telaPonto) telaPonto.style.display = "block";
                if (btnNavCadastro) btnNavCadastro.classList.remove("active");
                if (btnNavPonto) btnNavPonto.classList.add("active");
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const btn  = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            
            const aplicar = (tema) => {
                document.documentElement.setAttribute('data-theme', tema);
                localStorage.setItem('theme', tema);
                if (icon) icon.textContent = tema === 'dark' ? '🌙' : '☀️';
            };
            
            aplicar(localStorage.getItem('theme') || 'dark');
            
            if (btn) {  
                btn.addEventListener('click', () => {
                    aplicar(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
                });
            }
        });
    </script>

</body>
</html>
