<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.U. - Sistema de Inventário Unificado</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/estoque.css">
</head>
<body>

    <header class="header-modulo">
        <div>
            <small>Módulo de Operações</small>
            <h2>📦 Gestão de Inventário</h2>
        </div>
        <div class="header-actions">
            <div class="theme-toggle-wrap">
                <span class="theme-icon" id="themeIcon">🌙</span>
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"></button>
            </div>
            <button class="btn-voltar" onclick="window.location.href='../../app.html'">← Voltar ao Menu</button>
        </div>
    </header>

    <nav>
        <button onclick="trocarTela('cadastro')">📥 Recebimento</button>
        <button onclick="trocarTela('estoque')">📊 Controle de Estoque</button>
    </nav>

    <div class="main-content">
        <div id="tela-cadastro" class="container">
            <h1>Entrada de Materiais</h1>
            <div class="card">
                <input type="text" id="nomeItem" placeholder="Nome do Produto">
                <input type="number" id="qtdItem" placeholder="Quantidade Inicial">
                <button id="btnRegistrar">Registrar no Sistema</button>
            </div>
            <div class="card" style="margin-top: 20px;">
                <h3>Itens no Pátio (Aguardando Liberação)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </div>

        <div id="tela-estoque" class="container" style="display: none;">
            <h1>Controle de Saída</h1>
            <div class="card">
                <h2 id="produtoSelecionado">Nenhum item selecionado</h2>
                <div id="visorQtd" class="visor">0</div>
                <input type="number" id="valorMovimentacao" placeholder="Quantidade">
                <div style="display: flex; gap: 10px;">
                    <button id="btnEntrada" style="background: #27ae60;">+ Entrada</button>
                    <button id="btnSaida"   style="background: #c0392b;">- Saída</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 S.I.U. - Sistema de Inventário Unificado</p>
    </footer>

    <script>
        // Aplica tema antes do paint
        (function () {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <script src="../../assets/js/estoque.js" defer></script>
    <script>
        // Toggle de tema — inicializa após o DOM
        document.addEventListener('DOMContentLoaded', () => {
            const btn  = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const aplicar = (tema) => {
                document.documentElement.setAttribute('data-theme', tema);
                localStorage.setItem('theme', tema);
                if (icon) icon.textContent = tema === 'dark' ? '🌙' : '☀️';
            };
            aplicar(localStorage.getItem('theme') || 'dark');
            if (btn) btn.addEventListener('click', () => {
                aplicar(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });
        });
    </script>
    <script src="../../assets/js/acessibilidade.js"></script>
</body>
</html>
