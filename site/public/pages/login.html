<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP Industrial</title>

    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

    <div id="header"></div>

    <div class="container">
        <div class="login-box-card">

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login', this)">Entrar</button>
                <button class="tab-btn"        onclick="switchTab('cadastro', this)">Cadastrar</button>
            </div>

            <div id="pane-login" class="pane active">
                <div class="form-body">
                    <h2>Bem-vindo de volta</h2>
                    <p class="subtitle">Acesse sua conta do ERP Industrial</p>

                    <div class="field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="seu@email.com">
                    </div>
                    
                    <div class="field">
                        <label for="loginSenha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginSenha" placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginSenha', this)" aria-label="Mostrar senha">◉</button>
                        </div>
                    </div>

                    <button class="btn-main" onclick="fazerLogin()">Entrar</button>

                    <p class="footer-link">
                        Não tem conta?
                        <span onclick="switchTab('cadastro', document.querySelectorAll('.tab-btn')[1])">Criar uma agora</span>
                    </p>

                    <p id="mensagem"></p>
                </div>
            </div>

            <div id="pane-cadastro" class="pane">
                <div class="form-body">
                    <h2>Crie sua conta</h2>
                    <p class="subtitle">Comece a gerir a sua indústria hoje mesmo</p>

                    <div class="field">
                        <label for="cadEmail">Email</label>
                        <input type="email" id="cadEmail" placeholder="seu@email.com">
                    </div>
                    
                    <div class="field">
                        <label for="cadSenha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="cadSenha" placeholder="••••••••">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('cadSenha', this)" aria-label="Mostrar senha">◉</button>
                        </div>
                    </div>

                    <button class="btn-main btn-cad-main" onclick="cadastrar()">Cadastrar</button>

                    <p class="footer-link">
                        Já tem conta?
                        <span onclick="switchTab('login', document.querySelectorAll('.tab-btn')[0])">Entrar</span>
                    </p>

                    <p id="mensagem-cad"></p>
                </div>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <script>
        function switchTab(pane, btn) {
            document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pane-' + pane).classList.add('active');
            btn.classList.add('active');
        }
    </script>

   <script type="module" src="../assets/js/login.js"></script>
    <script type="module" src="../assets/js/component.js"></script>
    <script  type="module" src="../assets/js/verificacaologin.js"></script>
    <script src="../assets/js/acessibilidade.js"></script>
    <script src="../../app/assets/js/logs.js"></script>
</body>
</html>
