<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeTech | Sistema de Orçamento</title>
    <link rel="shortcut icon" href="../assets/img/Getech.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/orcamento.css">
    <link rel="stylesheet" href="../assets/css/acessibilidade.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="../assets/img/Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Contato.html">Contato</a></li>
            <li><a href="material.html">Materiais</a></li>
            <li class="restrito gestor"><a href="orçamento.html">Orçamentos</a></li>
            <li class="restrito gestor"><a href="mensagem.html">Mensagens</a></li>
            <li class="restrito gestor"><a href="sistema.html">Sistema</a></li>
            <li>
                <a href="cadastro.html">
                    <img id="avatarUsuario" src="../assets/img/perfil.jpg" alt="Foto de Perfil" style="display: inline-block; width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; object-fit: cover;">
                </a>
            </li>
            
            <li id="menuSair" style="display: none;"><a href="#" id="btnSair" style="color: #ef4444; font-weight: bold;">Sair</a></li>
        </ul>
    </nav>
</header>

<div class="main-content">
    <div class="card">
        <h2>Gerador de Orçamento</h2>

        <div class="inputs">
            <input type="text" id="desc" placeholder="Descrição do Item">
            <input type="number" id="valor" placeholder="Preço (R$)">
            <input type="number" id="qtd" placeholder="Qtd" value="1">
            <button class="btn-add" onclick="adicionarItem()">Adicionar</button>
        </div>

        <table id="tabela">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qtd</th>
                    <th>Unitário</th>
                    <th>Total</th>
                    <th style="width: 50px;">Ação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total-container">
            Total: <span>R$ <span id="valorTotal">0,00</span></span>
        </div>
        
        <div class="controles-finais">
            <button class="btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
            <button class="btn-add" style="background-color: #059669;" onclick="window.print()">Gerar PDF / Imprimir</button>
        </div>
    </div>
</div>

<script src="../assets/js/orcamento.js"></script>
<script src="../assets/js/controle.js"></script>
<script src="../assets/js/acessibilidade.js"></script>
</body>
</html>
