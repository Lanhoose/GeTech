<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>GeTech - Redirecionando</title>
  <script>
    const BASE_URL = window.location.origin + "/GeTech/";
  
    // Aguarda 1 segundo (1000ms) antes de mudar de página
    setTimeout(function() {
      window.location.href = BASE_URL + "site/public/pages/index.html";
    }, 1000);
  </script>
</head>
<body>
  <div style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #333;">
    <p>Carregando o GeTech...</p>
    <small style="color: #888;">Você será redirecionado em 1 segundo.</small>
  </div>
</body>
</html>
