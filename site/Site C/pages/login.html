    <link rel="shortcut icon" href="../assets/img/Getech.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/acessibilidade.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="../assets/img/Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

     <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="chat.html">ChaBot</a></li>
            <li><a href="contato.html">Contato</a></li>
            <li><a href="material.html">Materiais</a></li>
            <li class="restrito patrocinador escondido"><a href="patrocinadores.html">Patrocinadores</a></li>
            <li class="restrito gestor escondido"><a href="orcamento.html">Orçamentos</a></li>
            <li class="restrito gestor escondido"><a href="mensagem.html">Mensagens</a></li>
            <li class="restrito gestor escondido"><a href="sistema.html">Sistema</a></li>
            <li id="menuUsuario">
                <a href="cadastro.html" id="linkPerfil">
                    <img id="avatarUsuario" src="../assets/img/perfil.jpg" alt="Foto de Perfil" style="display: none;">
                </a>
            </li>
            <li id="menuSair" style="display: none;"><a href="#" id="btnSair" style="color: #ef4444; font-weight: bold;">Sair</a></li>
        </ul>
    </nav>
</header>

<main class="login-container">
    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">E-mail ou Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu acesso" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a><br><br>
            <span>Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></span>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 GeTech Soluções Industriais. Todos os direitos reservados.</p>
</footer>


<script type="module" src="../assets/js/login.js"></script>
<script type="module" src="../assets/js/controle.js"></script>

</body>
</html>
