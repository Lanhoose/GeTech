<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeTech | Login</title>
    <link rel="shortcut icon" href="
    ../assets/img/Getech.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

<header>
    <div class="logo-container">
        <img src="../assets/img/Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

<nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="Contato.html">Contato</a></li>
        <li><a href="material.html">Materiais</a></li>
        <li class="restrito gestor"><a href="orçamento.html">Orçamentos</a></li>
        <li class="restrito gestor"><a href="mensagem.html">Mensagens</a></li>
        <li class="restrito gestor"><a href="sistema.html">Sistema</a></li>
        <li><a href="cadastro.html"><img id="avatarUsuario" src="../assets/img/perfil.jpg" alt="Foto de Perfil" style="display: inline-block; width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; object-fit: cover;"></a></li>
    </ul>
</nav>
</header>

<main class="login-container">
    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">E-mail ou Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu acesso" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a><br><br>
            <span>Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></span>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 GeTech Soluções Industriais</p>
</footer>
<script src="../assets/js/login.js"></script>
<script src="../assets/js/controle.js"></script>
<script src="../assets/js/acessibilidade.js"></script>
</body>
</html>
