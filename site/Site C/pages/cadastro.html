<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeTech | Cadastro de Usuário</title>
    <link rel="shortcut icon" href="../assets/img/Getech.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/cadastro.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="../assets/img/Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Contato.html">Contato</a></li>
            <li><a href="material.html">Materiais</a></li>
            <li class="restrito gestor"><a href="orçamento.html">Orçamentos</a></li>
            <li class="restrito gestor"><a href="mensagem.html">Mensagens</a></li>
            <li class="restrito gestor"><a href="sistema.html">Sistema</a></li>
            <li>
                <a href="cadastro.html">
                    <img id="avatarUsuario" src="../assets/img/perfil.jpg" alt="Foto de Perfil">
                </a>
            </li>
        </ul>
    </nav>
</header>

<main class="cadastro-container">
    <div class="cadastro-card">
        <h2>Criar Nova Conta</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 0.95rem;">Selecione seu perfil para acessar as ferramentas corretas.</p>
        
        <form id="cadastroForm" action="javascript:void(0);">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="tipo_usuario">Eu sou um:</label>
                    <select id="tipo_usuario" class="perfil-selector" required>
                        <option value="cliente">Cliente</option>
                        <option value="gestor">Gestor GeTech</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="nome">Nome Completo / Razão Social</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva ou Metalúrgica ABC" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" placeholder="email@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="doc">CPF ou CNPJ</label>
                    <input type="text" id="doc" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="form-group">
                    <label for="tel">Telefone/WhatsApp</label>
                    <input type="tel" id="tel" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="setor">Setor Principal</label>
                    <select id="setor">
                        <option value="manutencao">Manutenção Industrial</option>
                        <option value="producao">Linha de Produção</option>
                        <option value="logistica">Logística/Estoque</option>
                        <option value="outro">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="form-group">
                    <label for="senha2">Confirmar Senha</label>
                    <input type="password" id="senha2" required>
                </div>

                <div class="form-group full-width">
                    <label>Foto de Perfil</label>
                    <label for="foto" class="btn-upload-custom">
                        📷 Selecionar Foto de Perfil
                    </label>
                    <input type="file" id="foto" accept="image/*" class="escondido">
                    <span id="nome-arquivo" style="display: block; margin-top: 5px; color: #666; font-size: 0.85rem; text-align: center;">Nenhuma foto selecionada</span>
                </div>
            </div>

            <button type="submit" class="btn-cadastro">Finalizar e Acessar</button>
        </form>

        <div class="links-auxiliares">
            <span>Já tem conta? <a href="login.html" style="color: var(--azul-industrial); text-decoration: none; font-weight: bold;">Fazer Login</a></span>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 GeTech Soluções Industriais</p>
</footer>

<script src="../assets/js/cadastro.js"></script>
<script src="../assets/js/controle.js"></script>
<script src="../assets/js/acessibilidade.js"></script>

</body>
</html>
