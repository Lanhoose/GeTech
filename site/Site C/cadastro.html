<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeTech | Cadastro de Usuário</title>
    
    <style>
        :root {
            --azul-industrial: #0664d7;
            --azul-alerta: #3d92ff;
            --cinza-claro: #f4f4f4;
            --branco: #ffffff;
            --preto-suave: #333;
            --cor-gestor: #2c3e50; /* Cor diferenciada para o perfil Gestor */
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Fixo */
        header {
            background-color: var(--azul-industrial);
            color: var(--branco);
            padding: 0.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%; 
            box-sizing: border-box; 
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px; 
        }

        .logo-img {
            height: 50px; 
            border-radius: 40px;
        }

        .logo-texto {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Container de Cadastro */
        .cadastro-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            margin-top: 80px;
        }

        .cadastro-card {
            background: var(--branco);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            border-top: 5px solid var(--azul-industrial);
        }

        .cadastro-card h2 {
            text-align: center;
            color: var(--azul-industrial);
            margin: 0 0 10px 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        /* Destaque para o campo de Perfil */
        .perfil-selector {
            background-color: #f0f7ff;
            border: 2px solid var(--azul-industrial) !important;
            font-weight: bold;
            color: var(--azul-industrial);
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--preto-suave);
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--azul-industrial);
        }

        .btn-cadastro {
            background-color: var(--azul-industrial);
            color: var(--branco);
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
        }

        .btn-cadastro:hover {
            background-color: #054da5;
        }

        .links-auxiliares {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Contato.html">Contato</a></li>
            <li><a href="orçamento.html">Orçamento</a></li>
            <li><a href="loginreal.html">Sistema</a></li>
            <li><a href="mensagem.html">Caixa de Mensagem</a></li>
            <li><a href="cadastro.html"><img src="perfil.jpg" alt="Perfil" class="logo-img"></a></li>
        </ul>
    </nav>
</header>

<main class="cadastro-container">
    <div class="cadastro-card">
        <h2>Criar Nova Conta</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Selecione seu perfil para acessar as ferramentas corretas.</p>
        
        <form id="cadastroForm" action="processa_cadastro.php">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="tipo_usuario">Eu sou um:</label>
                    <select id="tipo_usuario" class="perfil-selector" required>
                        <option value="cliente">Cliente </option>
                        <option value="gestor">Gestor GeTech</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="nome">Nome Completo / Razão Social</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva ou Metalúrgica ABC" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" placeholder="email@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="doc">CPF ou CNPJ</label>
                    <input type="text" id="doc" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="form-group">
                    <label for="tel">Telefone/WhatsApp</label>
                    <input type="tel" id="tel" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="setor">Setor Principal</label>
                    <select id="setor">
                        <option value="manutencao">Manutenção Industrial</option>
                        <option value="producao">Linha de Produção</option>
                        <option value="logistica">Logística/Estoque</option>
                        <option value="outro">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="form-group">
                    <label for="senha2">Confirmar Senha</label>
                    <input type="password" id="senha2" required>
                </div>
            </div>

            <button type="submit" class="btn-cadastro">Finalizar e Acessar</button>
        </form>

        <div class="links-auxiliares">
            <span>Já tem conta? <a href="login.html" style="color: var(--azul-industrial); text-decoration: none; font-weight: bold;">Fazer Login</a></span>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 GeTech Soluções Industriais</p>
</footer>

<script>
    document.getElementById('cadastroForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Captura o tipo de usuário selecionado
        const tipoUsuario = document.getElementById('tipo_usuario').value;
        const nomeUsuario = document.getElementById('nome').value;
        const s1 = document.getElementById('senha').value;
        const s2 = document.getElementById('senha2').value;

        // Validação básica de senha
        if (s1 !== s2) {
            alert("⚠️ As senhas não conferem. Tente novamente.");
            return;
        }

        // SALVAMENTO SIMULADO (LocalStorage)
        // Isso permite que o sistema "lembre" quem você é na próxima página
        const dadosUsuario = {
            nome: nomeUsuario,
            perfil: tipoUsuario,
            loginAtivo: true
        };
        localStorage.setItem('sessaoGeTech', JSON.stringify(dadosUsuario));

        // LÓGICA DE REDIRECIONAMENTO
        if (tipoUsuario === 'gestor') {
            alert("✅ Perfil GESTOR identificado! Redirecionando para o Painel Administrativo...");
            window.location.href = "login.html"; // Nome da sua página de gestor
        } else {
            alert("✅ Cadastro de CLIENTE concluído! Bem-vindo à sua área de orçamentos.");
            window.location.href = "area_cliente.html"; // Nome da sua página de cliente
        }
    });
</script>

</body>
</html>
