<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeTech | Cadastro de Usuário</title>
    <link rel="shortcut icon" href="Getech.png" type="image/x-icon">

    
    <style>
        :root {
            --azul-industrial: #0664d7;
            --azul-alerta: #3d92ff ;
            --cinza-claro: #f4f4f4;
            --branco: #ffffff;
            --preto-suave: #333;
            --cor-gestor: #2c3e50; /* Cor diferenciada para o perfil Gestor */
        }

        /* ADICIONADO: Regra para sumir com os elementos */
        .escondido {
            display: none !important;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--azul-industrial);
            color: var(--branco);
            padding: 0.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%; 
            box-sizing: border-box; 
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px; 
        }

        .logo-img {
            height: 50px; 
            display: block;
            border-radius: 40px;
        }

        .logo-texto {
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Container de Cadastro */
        .cadastro-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            margin-top: 80px;
        }

        .cadastro-card {
            background: var(--branco);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            border-top: 5px solid var(--azul-industrial);
        }

        .cadastro-card h2 {
            text-align: center;
            color: var(--azul-industrial);
            margin: 0 0 10px 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        /* Destaque para o campo de Perfil */
        .perfil-selector {
            background-color: #f0f7ff;
            border: 2px solid var(--azul-industrial) !important;
            font-weight: bold;
            color: var(--azul-industrial);
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--preto-suave);
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--azul-industrial);
        }

        .btn-cadastro {
            background-color: var(--azul-industrial);
            color: var(--branco);
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
        }

        .btn-cadastro:hover {
            background-color: #054da5;
        }

        .links-auxiliares {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }

        /* Estilização do Botão Customizado de Upload */
        .btn-upload-custom {
            display: block;
            background-color: var(--branco);
            color: var(--azul-industrial);
            border: 2px dashed var(--azul-industrial);
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.3s ease;
        }

        .btn-upload-custom:hover {
            background-color: #f0f7ff;
            border-style: solid;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Getech.png" alt="Logo GeTech" class="logo-img">
        <span class="logo-texto"><strong>GE</strong>TECH</span>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Contato.html">Contato</a></li>
            <li><a href="material.html">Materiais</a></li>
            <li class="restrito gestor"><a href="orçamento.html">Orçamentos</a></li>
            <li class="restrito gestor"><a href="mensagem.html">Mensagens</a></li>
            <li class="restrito gestor"><a href="sistema.html">Sistema</a></li>
            <li>
                <a href="cadastro.html">
                    <img id="avatarUsuario" src="perfil.jpg" alt="Foto de Perfil" style="display: inline-block; width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; object-fit: cover;">
                </a>
            </li>
        </ul>
    </nav>
</header>

<main class="cadastro-container">
    <div class="cadastro-card">
        <h2>Criar Nova Conta</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Selecione seu perfil para acessar as ferramentas corretas.</p>
        
        <form id="cadastroForm" action="javascript:void(0);">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="tipo_usuario">Eu sou um:</label>
                    <select id="tipo_usuario" class="perfil-selector" required>
                        <option value="cliente">Cliente </option>
                        <option value="gestor">Gestor GeTech</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="nome">Nome Completo / Razão Social</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva ou Metalúrgica ABC" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" placeholder="email@empresa.com" required>
                </div>

                <div class="form-group">
                    <label for="doc">CPF ou CNPJ</label>
                    <input type="text" id="doc" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="form-group">
                    <label for="tel">Telefone/WhatsApp</label>
                    <input type="tel" id="tel" placeholder="(11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="setor">Setor Principal</label>
                    <select id="setor">
                        <option value="manutencao">Manutenção Industrial</option>
                        <option value="producao">Linha de Produção</option>
                        <option value="logistica">Logística/Estoque</option>
                        <option value="outro">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="form-group">
                    <label for="senha2">Confirmar Senha</label>
                    <input type="password" id="senha2" required>
                </div>

                <div class="form-group full-width">
                    <label>Foto de Perfil</label>
                    <!-- Botão customizado que o usuário realmente vai ver -->
                    <label for="foto" class="btn-upload-custom">
                        📷 Selecionar Foto de Perfil
                    </label>
                    <!-- O input original fica escondido, mas funciona através do 'id' -->
                    <input type="file" id="foto" accept="image/*" class="escondido">
                    <!-- Feedback visual para mostrar o nome do arquivo selecionado -->
                    <span id="nome-arquivo" style="display: block; margin-top: 5px; color: #666; font-size: 0.85rem; text-align: center;">Nenhuma foto selecionada</span>
                </div>
            </div>


            <button type="submit" class="btn-cadastro">Finalizar e Acessar</button>
        </form>

        <div class="links-auxiliares">
            <span>Já tem conta? <a href="login.html" style="color: var(--azul-industrial); text-decoration: none; font-weight: bold;">Fazer Login</a></span>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 GeTech Soluções Industriais</p>
</footer>

<script>
// Função auxiliar para converter o ficheiro de imagem numa string Base64
function converterParaBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// Listener para atualizar o nome do arquivo na tela quando o usuário escolher a foto
document.getElementById('foto').addEventListener('change', function() {
    const arquivo = this.files[0];
    const textoFeedback = document.getElementById('nome-arquivo');
    
    if (arquivo) {
        textoFeedback.textContent = `▶ Ficheiro selecionado: ${arquivo.name}`;
        textoFeedback.style.color = "var(--azul-industrial)";
    } else {
        textoFeedback.textContent = "Nenhuma foto selecionada";
        textoFeedback.style.color = "#666";
    }
});

// Repara no 'async' adicionado antes da função do evento
document.getElementById('cadastroForm').addEventListener('submit', async function(event) {
    event.preventDefault(); 
    
    const tipoUsuario = document.getElementById('tipo_usuario').value; 
    const nomeUsuario = document.getElementById('nome').value;
    const emailUsuario = document.getElementById('email').value.trim().toLowerCase();
    const s1 = document.getElementById('senha').value;
    const s2 = document.getElementById('senha2').value;
    const fotoInput = document.getElementById('foto').files[0]; // Pega o ficheiro carregado

    if (s1 !== s2) {
        alert("⚠️ As senhas não conferem. Tente novamente.");
        return;
    }

    // Processa a foto (se o utilizador tiver escolhido uma)
    let fotoBase64 = "";
    if (fotoInput) {
        try {
            // Converte a imagem para texto (Base64)
            fotoBase64 = await converterParaBase64(fotoInput);
        } catch (erro) {
            alert("⚠️ Erro ao processar a imagem. Tenta outra foto.");
            return;
        }
    } else {
        // Foto padrão (avatar) caso o utilizador não faça upload de nenhuma
        fotoBase64 = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }

    // 1. Pega a lista de utilizadores já cadastrados ou cria uma lista vazia
    let usuariosCadastrados = JSON.parse(localStorage.getItem('usuariosGeTech')) || [];

    // 2. Verifica se o e-mail já está cadastrado
    const usuarioExiste = usuariosCadastrados.some(user => user.email === emailUsuario);
    if (usuarioExiste) {
        alert("⚠️ Este e-mail já está cadastrado!");
        return;
    }

    // 3. Cria o novo utilizador guardando também a FOTO
    const novoUsuario = {
        nome: nomeUsuario,
        email: emailUsuario,
        senha: s1,
        perfil: tipoUsuario,
        foto: fotoBase64 // <-- Foto guardada aqui
    };
    usuariosCadastrados.push(novoUsuario);
    localStorage.setItem('usuariosGeTech', JSON.stringify(usuariosCadastrados));

    // 4. Cria a sessão ativa para o utilizador que se acabou de cadastrar
    const dadosSessao = {
        nome: nomeUsuario,
        perfil: tipoUsuario,
        foto: fotoBase64, // <-- Passa a foto para a sessão ativa
        loginAtivo: true
    };
    localStorage.setItem('sessaoGeTech', JSON.stringify(dadosSessao));

    // Redirecionamento
    if (tipoUsuario === 'gestor') {
        alert("✅ Perfil GESTOR cadastrado com sucesso! Redirecionando para o Painel...");
        window.location.href = "sistema.html"; 
    } else {
        alert("✅ Cadastro de CLIENTE concluído! Redirecionando para a Home...");
        window.location.href = "index.html";
    }
});
</script>
<script src="controle.js"></script>

</body>
</html>
